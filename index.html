<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>给你一颗小心心</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #fff1f4, #ffe0e8);
      color: #76394b;
      font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    }

    main {
      padding: 48px 24px;
      text-align: center;
    }

    .heart {
      width: 100px;
      height: 100px;
      margin: 0 auto 48px;
      position: relative;
      transform: rotate(-45deg);
      background: #f04e78;
      animation: heartbeat 1.2s ease-in-out infinite;
      filter: drop-shadow(0 10px 18px #d94d7040);
    }

    .heart::before,
    .heart::after {
      width: 100px;
      height: 100px;
      position: absolute;
      border-radius: 50%;
      background: #f04e78;
      content: "";
    }

    .heart::before {
      top: -50px;
      left: 0;
    }

    .heart::after {
      top: 0;
      right: -50px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 7vw, 40px);
    }

    p {
      margin: 0;
      color: #966273;
      font-size: 17px;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: rotate(-45deg) scale(1);
      }

      15% {
        transform: rotate(-45deg) scale(1.15);
      }

      30% {
        transform: rotate(-45deg) scale(1);
      }

      45% {
        transform: rotate(-45deg) scale(1.1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="heart" role="img" aria-label="一颗跳动的粉色爱心"></div>
    <h1>送你一颗小心心</h1>
    <p>李冰忻天天开心</p>
  </main>
</body>
</html>
